name: portfolio_website
description: "A new Flutter project."
version: 1.0.0+1

environment:
  sdk: '^3.10.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  injectable: ^2.5.1
  flutter_bloc: ^9.1.1
  easy_localization: ^3.0.8
  json_annotation: ^4.9.0
  get_it: ^8.2.0
  flutter_svg: ^2.2.0
  bloc: ^9.0.0
  cached_network_image: ^3.4.1
  font_awesome_flutter: ^10.9.1
  percent_indicator: ^4.2.5
  flutter_animate: ^4.5.2
  flutter_staggered_grid_view: ^0.7.0
  supabase_flutter: ^2.12.0
  flutter_dotenv: ^5.1.0
  flutter_spinkit: ^5.2.2
  url_launcher: ^6.3.2
  carousel_slider: ^5.1.1
  photo_view: ^0.15.0
  equatable: ^2.0.8
  
dev_dependencies:
  build_runner: ^2.6.0
  json_serializable: ^6.10.0
  injectable_generator: ^2.8.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/translations/
    - .env

  fonts:
    - family: lato
      fonts:
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lato-Black.ttf
          weight: 900
        - asset: assets/fonts/Lato-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lato-Semibold.ttf
          weight: 600

flutter_assets:
  assets_path: assets/images/
  output_path: lib\core\utils\constants\
  filename: app_assets.dart
